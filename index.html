<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Russel Diaz | 2D Illustrator and Concept Designer</title>
    <meta
      name="description"
      content="Featured work and contact details for Russel Diaz, 2D Illustrator and Concept Designer."
    />
    <meta name="theme-color" content="#15171d" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;800&family=Instrument+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas class="guides" aria-hidden="true"></canvas>

    <header class="nav">
      <a class="nav__brand" href="#work">
        <img class="nav__logo" src="/logo.png" alt="" width="183" height="240" />
        <span class="nav__text">
          <span class="nav__name" data-content="name"></span>
          <span class="nav__role" data-content="role"></span>
        </span>
      </a>
      <nav aria-label="Main">
        <ul class="nav__links">
          <li><a href="#work">Work</a></li>
          <li><a href="#about">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="work" class="page featured" aria-labelledby="page-title">
        <h1 id="page-title" class="visually-hidden">
          <span data-content="name"></span>, <span data-content="role"></span>: featured work
        </h1>
        <div class="carousel" data-carousel aria-roledescription="carousel">
          <button
            class="carousel__arrow carousel__arrow--prev"
            type="button"
            aria-label="Previous artwork"
          ></button>
          <ul class="carousel__track" aria-live="polite"></ul>
          <button
            class="carousel__arrow carousel__arrow--next"
            type="button"
            aria-label="Next artwork"
          ></button>
        </div>
        <div class="featured__footer">
          <p class="carousel__status" aria-hidden="true"></p>
          <a class="scroll-cue" href="#about">
            <span class="visually-hidden">Go to contact details</span>
            <span class="scroll-cue__chevron" aria-hidden="true"></span>
            <span class="scroll-cue__chevron" aria-hidden="true"></span>
            <span class="scroll-cue__chevron" aria-hidden="true"></span>
          </a>
        </div>
      </section>

      <section id="about" class="page about" aria-labelledby="about-title">
        <article class="card">
          <svg
            class="card__frame"
            aria-hidden="true"
            preserveAspectRatio="none"
            viewBox="0 0 100 100"
          >
            <polygon
              points="0,6 4,0 96,0 100,6 100,94 96,100 4,100 0,94"
              vector-effect="non-scaling-stroke"
              pathLength="1"
            />
          </svg>
          <img class="card__logo" src="/logo.png" alt="" width="183" height="240" />
          <h2 id="about-title" class="card__name" data-content="name"></h2>
          <p class="card__role" data-content="role"></p>
          <dl class="card__links" data-content="links"></dl>
          <a class="button" data-content="email-button">Email Russel</a>
        </article>
        <footer class="footer">
          <p>
            &copy; <span data-content="year"></span> Russel Diaz. All artwork belongs to the artist.
          </p>
        </footer>
      </section>
    </main>

    <dialog class="lightbox" aria-label="Artwork viewer">
      <button class="lightbox__close" type="button" aria-label="Close artwork viewer">Close</button>
      <figure>
        <img class="lightbox__image" alt="" />
        <figcaption class="lightbox__caption"></figcaption>
      </figure>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
